name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version; empty uses project version first, then bump type"
        required: false
        default: ""
      bump:
        description: "Version bump type (if version is not specified)"
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Validate the release without pushing"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.visibility == 'public' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          ignore: brands

  release:
    name: Cut release
    if: >-
      ${{ !cancelled() && needs.hassfest.result == 'success' &&
      (needs.hacs.result == 'success' || needs.hacs.result == 'skipped') }}
    needs: [hassfest, hacs]
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: ./.github/actions/setup-hypercolor
        with:
          hypercolor-ref: ${{ vars.HYPERCOLOR_REF || '8b6a6adb94b77116ccbfff05064837d566f616d4' }}
          hypercolor-token: ${{ secrets.HYPERCOLOR_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Plan release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: >-
          uv run --no-project --python 3.14 python scripts/release.py
          --version "${INPUT_VERSION}"
          --bump "${INPUT_BUMP}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Stamp release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          uv version "${VERSION}" --no-sync
          perl -0pi -e 's/"version": "[^"]+"/"version": "$ENV{VERSION}"/' \
            custom_components/hypercolor/manifest.json
          uv lock
          stamped_project="$(uv version --short)"
          stamped_manifest="$(jq -r '.version' custom_components/hypercolor/manifest.json)"
          if [[ "${stamped_project}" != "${VERSION}" || "${stamped_manifest}" != "${VERSION}" ]]; then
            echo "Stamp failed: pyproject=${stamped_project} manifest=${stamped_manifest} expected=${VERSION}" >&2
            exit 1
          fi

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Verify
        run: just verify

      - name: Validate release diff
        run: |
          set -euo pipefail
          git diff --check
          unexpected=""
          while IFS= read -r line; do
            path="${line:3}"
            case "${path}" in
              pyproject.toml|custom_components/hypercolor/manifest.json|uv.lock) ;;
              *) unexpected+="${path}"$'\n' ;;
            esac
          done < <(git status --porcelain)
          if [[ -n "${unexpected}" ]]; then
            echo "Release preparation changed unexpected files:" >&2
            printf '%s' "${unexpected}" >&2
            exit 1
          fi

      - name: Commit release version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- pyproject.toml custom_components/hypercolor/manifest.json uv.lock; then
            echo "Version files already match ${TAG}; no release commit needed"
            exit 0
          fi
          git add pyproject.toml custom_components/hypercolor/manifest.json uv.lock
          {
            printf 'chore(release): cut %s\n\n' "${TAG}"
            printf 'Stamp integration metadata and the lockfile for %s.\n' "${TAG}"
          } | git commit -F -

      - name: Create release tag
        if: steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git tag -a "${TAG}" -m "Hypercolor HASS ${TAG}"

      - name: Push release commit and tag
        if: inputs.dry_run == false && steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin HEAD:main "refs/tags/${TAG}"

      - name: Dispatch and monitor build and publish
        id: publish
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          before_id="$(
            gh run list --workflow ci.yml --event workflow_dispatch \
              --branch "${TAG}" --commit "${candidate_sha}" --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty'
          )"
          gh workflow run ci.yml --ref "${TAG}"

          run_id=""
          for _ in {1..30}; do
            candidate_id="$(
              gh run list --workflow ci.yml --event workflow_dispatch \
                --branch "${TAG}" --commit "${candidate_sha}" --limit 1 \
                --json databaseId --jq '.[0].databaseId // empty'
            )"
            if [[ -n "${candidate_id}" && "${candidate_id}" != "${before_id}" ]]; then
              run_id="${candidate_id}"
              break
            fi
            sleep 2
          done
          if [[ -z "${run_id}" ]]; then
            echo "Timed out locating the ci.yml run for ${TAG}" >&2
            exit 1
          fi

          run_url="$(gh run view "${run_id}" --json url --jq '.url')"
          echo "run_url=${run_url}" >> "${GITHUB_OUTPUT}"
          gh run watch "${run_id}" --exit-status

      - name: Summarize
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_URL: ${{ steps.publish.outputs.run_url }}
          TAG: ${{ steps.version.outputs.tag }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
        run: |
          {
            echo "## Release ${TAG}"
            echo
            echo "- Dry run: ${DRY_RUN}"
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "- Build and validation passed; nothing was pushed"
            elif [[ "${TAG_EXISTS}" == "true" ]]; then
              echo "- Existing release tag reused after an interrupted publish"
              echo "- Build and publish completed: ${PUBLISH_URL}"
            else
              echo "- Release commit and tag pushed atomically"
              echo "- Build and publish completed: ${PUBLISH_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
