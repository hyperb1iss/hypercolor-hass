name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version; empty uses project version first, then bump type"
        required: false
        default: ""
      bump:
        description: "Version bump type (if version is not specified)"
        required: false
        type: choice
        default: "patch"
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Validate the release without pushing"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  release:
    name: Cut Release
    if: >-
      ${{ !cancelled() && needs.hassfest.result == 'success' &&
      (needs.hacs.result == 'success' || needs.hacs.result == 'skipped') }}
    needs: [hassfest, hacs]
    permissions:
      actions: write
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check out Hypercolor client
        env:
          HYPERCOLOR_REF: ${{ vars.HYPERCOLOR_REF || '978096e614695777d3cd13ea0b184877e46afd84' }}
          HYPERCOLOR_TOKEN: ${{ secrets.HYPERCOLOR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "${HYPERCOLOR_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "HYPERCOLOR_REF must be a full commit SHA" >&2
            exit 1
          fi
          if [ -n "${HYPERCOLOR_TOKEN}" ]; then
            remote_url="https://x-access-token:${HYPERCOLOR_TOKEN}@github.com/hyperb1iss/hypercolor.git"
          else
            remote_url="https://github.com/hyperb1iss/hypercolor"
          fi
          git init -q ../hypercolor
          git -C ../hypercolor remote add origin "${remote_url}"
          git -C ../hypercolor fetch --depth 1 origin "${HYPERCOLOR_REF}"
          git -C ../hypercolor checkout --detach FETCH_HEAD

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.14

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          project_version="$(uv version --short)"
          manifest_version="$(jq -r '.version' custom_components/hypercolor/manifest.json)"
          if [[ "${project_version}" != "${manifest_version}" ]]; then
            echo "Project version ${project_version} does not match manifest ${manifest_version}" >&2
            exit 1
          fi

          latest_tag="$(
            git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              head -n1 || true
          )"
          if [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION#v}"
          elif [[ -z "${latest_tag}" ]]; then
            version="${project_version}"
          else
            current="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "${current}"
            case "${INPUT_BUMP}" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="${major}.$((minor + 1)).0" ;;
              patch) version="${major}.${minor}.$((patch + 1))" ;;
            esac
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: ${version}; expected X.Y.Z" >&2
            exit 1
          fi

          tag="v${version}"
          tag_exists=false
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            tag_commit="$(git rev-list -n1 "${tag}")"
            head_commit="$(git rev-parse HEAD)"
            if [[ "${tag_commit}" != "${head_commit}" || "${version}" != "${project_version}" ]]; then
              echo "Tag ${tag} exists but does not match the current release state" >&2
              exit 1
            fi
            if gh release view "${tag}" >/dev/null 2>&1; then
              echo "GitHub release ${tag} already exists" >&2
              exit 1
            fi
            tag_exists=true
          fi

          if [[ -n "${latest_tag}" && "${tag_exists}" == "false" ]]; then
            highest="$(printf '%s\n%s\n' "${latest_tag#v}" "${version}" | sort -V | tail -n1)"
            if [[ "${highest}" != "${version}" || "${latest_tag#v}" == "${version}" ]]; then
              echo "Version ${version} is not above the latest tag ${latest_tag}" >&2
              exit 1
            fi
          fi

          {
            echo "current=${project_version}"
            echo "tag_exists=${tag_exists}"
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Stamp release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          uv version "${VERSION}" --no-sync
          perl -0pi -e 's/"version": "[^"]+"/"version": "$ENV{VERSION}"/' \
            custom_components/hypercolor/manifest.json
          uv lock
          stamped_project="$(uv version --short)"
          stamped_manifest="$(jq -r '.version' custom_components/hypercolor/manifest.json)"
          if [[ "${stamped_project}" != "${VERSION}" || "${stamped_manifest}" != "${VERSION}" ]]; then
            echo "Stamp failed: pyproject=${stamped_project} manifest=${stamped_manifest} expected=${VERSION}" >&2
            exit 1
          fi

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run ty check

      - name: Test
        run: uv run pytest

      - name: Validate metadata
        run: uv run python scripts/check_integration_metadata.py

      - name: Build
        run: uv build

      - name: Validate release diff
        run: |
          set -euo pipefail
          git diff --check
          unexpected=""
          while IFS= read -r line; do
            path="${line:3}"
            case "${path}" in
              pyproject.toml|custom_components/hypercolor/manifest.json|uv.lock) ;;
              *) unexpected+="${path}"$'\n' ;;
            esac
          done < <(git status --porcelain)
          if [[ -n "${unexpected}" ]]; then
            echo "Release preparation changed unexpected files:" >&2
            printf '%s' "${unexpected}" >&2
            exit 1
          fi

      - name: Commit release version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- pyproject.toml custom_components/hypercolor/manifest.json uv.lock; then
            echo "Version files already match ${TAG}; no release commit needed"
            exit 0
          fi
          git add pyproject.toml custom_components/hypercolor/manifest.json uv.lock
          {
            printf 'chore(release): cut %s\n\n' "${TAG}"
            printf 'Stamp integration metadata and the lockfile for %s.\n' "${TAG}"
          } | git commit -F -

      - name: Create release tag
        if: steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git tag -a "${TAG}" -m "Hypercolor HASS ${TAG}"

      - name: Push release commit and tag
        if: inputs.dry_run == false && steps.version.outputs.tag_exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git push origin "${TAG}"

      - name: Dispatch and monitor build and publish
        id: publish
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          before_id="$(
            gh run list --workflow ci.yml --event workflow_dispatch \
              --branch "${TAG}" --commit "${candidate_sha}" --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty'
          )"
          gh workflow run ci.yml --ref "${TAG}"

          run_id=""
          for _ in {1..30}; do
            candidate_id="$(
              gh run list --workflow ci.yml --event workflow_dispatch \
                --branch "${TAG}" --commit "${candidate_sha}" --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty'
            )"
            if [[ -n "${candidate_id}" && "${candidate_id}" != "${before_id}" ]]; then
              run_id="${candidate_id}"
              break
            fi
            sleep 2
          done
          if [[ -z "${run_id}" ]]; then
            echo "Timed out locating the ci.yml run for ${TAG}" >&2
            exit 1
          fi

          run_url="$(gh run view "${run_id}" --json url --jq '.url')"
          echo "run_url=${run_url}" >> "${GITHUB_OUTPUT}"
          gh run watch "${run_id}" --exit-status

      - name: Summarize
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_URL: ${{ steps.publish.outputs.run_url }}
          TAG: ${{ steps.version.outputs.tag }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
        run: |
          {
            echo "## Release ${TAG}"
            echo
            echo "- Dry run: ${DRY_RUN}"
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "- Build and validation passed; nothing was pushed"
            else
              if [[ "${TAG_EXISTS}" == "true" ]]; then
                echo "- Existing release tag reused after an interrupted publish"
              else
                echo "- Release commit and tag pushed"
              fi
              echo "- Build and publish completed: ${PUBLISH_URL}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
